<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Call N'Barb — Home Barbing Anywhere</title>
    <meta name="description" content="On-demand home barbering service anywhere in the world. Book professional barbers to your doorstep with Call N'Barb." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
       <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Call N'Barb</a>
        <button class="nav-toggle" aria-expanded="false" aria-label="Toggle Navigation"><span></span><span></span><span></span></button>
        <nav class="nav">
          <a href="#services" data-i18n="nav_services">Services</a>
          <a href="#how" data-i18n="nav_how">How It Works</a>
          <a href="#faq" data-i18n="nav_faq">FAQ</a>
           <a href="book.html" class="btn btn-outline" data-i18n="nav_cta">Book Now</a>
          <a href="join.html" class="btn btn-outline" data-i18n="nav_cta">Join Us</a>
        </nav>

         <div class="lang">
          <div class="lang-switch" role="group" aria-label="Language">
            <button class="lang-btn" data-lang="en" aria-label="English">🇺🇸</button>
            <button class="lang-btn" data-lang="tr" aria-label="Türkçe">🇹🇷</button>
            <button class="lang-btn" data-lang="el" aria-label="Ελληνικά (Κύπρος)">🇨🇾</button>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="hero" id="hero">
        <div class="container hero-content">
          <h1 class="hero-title" data-i18n="hero_title">Book A Barber Now.</h1>
          <p class="hero-subtitle" data-i18n="hero_subtitle"> Follow the procedure to book professional barbers to your doorstep. Fast, reliable, and stylish.</p>
          <div class="hero-actions">
            <a href="#cta" class="btn btn-primary" data-i18n="hero_book">Book a Barber</a>
            <a href="#how" class="btn btn-secondary" data-i18n="hero_learn">Learn More</a>
          </div>
        </div>
    </section>

    <section class="section" id="payment">
      <div class="container">
        <h2 class="section-title">Secure Card Payment</h2>
        <div class="contact-form">
          <form id="payment-form" novalidate>
            <div class="form-field">
              <label for="card-name">Name on Card</label>
              <input type="text" id="card-name" name="card_name" required />
            </div>
            <div class="form-field">
              <label for="card-number">Card Number</label>
              <input type="text" id="card-number" name="card_number" inputmode="numeric" autocomplete="cc-number" placeholder="1234 5678 9012 3456" required />
            </div>
            <div class="form-field" style="display:flex;gap:12px">
              <div style="flex:1">
                <label for="card-exp">Expiry</label>
                <input type="text" id="card-exp" name="card_exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" required />
              </div>
              <div style="flex:1">
                <label for="card-cvc">CVC</label>
                <input type="text" id="card-cvc" name="card_cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" required />
              </div>
            </div>
            <div class="form-field">
              <label for="country">Country</label>
              <input type="text" id="country" name="country" placeholder="e.g., Türkiye" />
            </div>
            <div class="form-status" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary">Pay Now</button>
          </form>
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© <span id="year"></span> Call N'Barb</span>
        <a href="privacy.html" class="footer-link">Privacy</a>
        <a href="privacy.html" class="footer-link">Terms</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
  </html>
